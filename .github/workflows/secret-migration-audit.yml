name: Secret migration audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Audit secret metadata
        shell: bash
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
          YOUTUBE_SOURCE_COOKIE_FILE_VIDEO2TEXT: ${{ secrets.YOUTUBE_SOURCE_COOKIE_FILE_VIDEO2TEXT }}
          BILIBILI_COOKIES: ${{ secrets.BILIBILI_COOKIES }}
          BILIBILI_SOURCE_COOKIE_FILE_VIDEO2TEXT: ${{ secrets.BILIBILI_SOURCE_COOKIE_FILE_VIDEO2TEXT }}
        run: |
          set -euo pipefail

          audit() {
            local name="$1"
            local value="$2"
            local expected_format="$3"

            if [[ -z "$value" ]]; then
              echo "$name present=false"
              return
            fi

            local bytes digest valid
            bytes="$(printf '%s' "$value" | wc -c | tr -d ' ')"
            digest="$(printf '%s' "$value" | sha256sum | cut -c1-16)"
            valid=false

            if [[ "$expected_format" == "netscape" && "$value" == *$'\t'* ]]; then
              valid=true
            fi

            echo "$name present=true bytes=$bytes sha256_16=$digest format=$expected_format valid=$valid"
          }

          audit YOUTUBE_COOKIES "${YOUTUBE_COOKIES:-}" netscape
          audit YOUTUBE_SOURCE_COOKIE_FILE_VIDEO2TEXT "${YOUTUBE_SOURCE_COOKIE_FILE_VIDEO2TEXT:-}" netscape
          audit BILIBILI_COOKIES "${BILIBILI_COOKIES:-}" netscape
          audit BILIBILI_SOURCE_COOKIE_FILE_VIDEO2TEXT "${BILIBILI_SOURCE_COOKIE_FILE_VIDEO2TEXT:-}" netscape

          [[ "$YOUTUBE_COOKIES" == "$YOUTUBE_SOURCE_COOKIE_FILE_VIDEO2TEXT" ]] && echo "youtube_migration_match=true" || echo "youtube_migration_match=false"
          [[ "$BILIBILI_COOKIES" == "$BILIBILI_SOURCE_COOKIE_FILE_VIDEO2TEXT" ]] && echo "bilibili_migration_match=true" || echo "bilibili_migration_match=false"
