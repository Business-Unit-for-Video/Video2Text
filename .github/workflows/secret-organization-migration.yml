name: Secret organization migration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.SECRET_MIGRATION_GITHUB_TOKEN }}
      SOURCE_YOUTUBE_COOKIE: ${{ secrets.YOUTUBE_COOKIES }}
      SOURCE_BILIBILI_COOKIE: ${{ secrets.BILIBILI_COOKIES }}
    steps:
      - name: Migrate source credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          test -n "$SOURCE_YOUTUBE_COOKIE"
          test -n "$SOURCE_BILIBILI_COOKIE"

          printf '%s' "$SOURCE_YOUTUBE_COOKIE" |
            gh secret set YOUTUBE_SOURCE_COOKIE_FILE_VIDEO2TEXT \
              --org Business-Unit-for-Video \
              --repos Video2Text

          printf '%s' "$SOURCE_BILIBILI_COOKIE" |
            gh secret set BILIBILI_SOURCE_COOKIE_FILE_VIDEO2TEXT \
              --org Business-Unit-for-Video \
              --repos Video2Text
